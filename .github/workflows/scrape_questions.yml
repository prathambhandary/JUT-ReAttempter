name: Auto Scrape Questions from Jnanasudha.com (JEE & KCET)

on:
  push:
    paths-ignore:
      - "data/question_bank.json"
      - "fix_json.py"
  workflow_dispatch:
  

jobs:

  jee:
    name: Scrape JEE Questions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSHKITTY_TOKEN }}
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Download JEE questions
        env:
          JEE_USERNAME: ${{ secrets.JEE_USERNAME }}
          JEE_PASSWORD: ${{ secrets.JEE_PASSWORD }}
        run: python download_test_jee.py

      - name: Commit JEE changes
        run: |
          git config user.name "pushkitty"
          git config user.email "pushkitty@firewave.in"

          git add .

          if git diff --staged --quiet; then
            echo "No JEE changes."
          else
            git commit -m "Updated JEE question bank"
            git push origin main
          fi


  kcet:
    name: Scrape KCET Questions
    runs-on: ubuntu-latest

    needs: jee

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSHKITTY_TOKEN }}
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Download KCET questions
        env:
          KCET_USERNAME: ${{ secrets.KCET_USERNAME }}
          KCET_PASSWORD: ${{ secrets.KCET_PASSWORD }}
        run: python download_test_kcet.py

      - name: Commit KCET changes
        run: |
          git config user.name "pushkitty"
          git config user.email "pushkitty@firewave.in"

          git add .

          if git diff --staged --quiet; then
            echo "No KCET changes."
          else
            git commit -m "Updated KCET question bank"

            git pull --rebase origin main
            git push origin main
          fi