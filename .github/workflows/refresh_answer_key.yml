name: Refresh Answer Key and Solution from Jnanasudha.com (JEE & KCET)

on:
  push:
    paths:
      - "fix_json.py"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: 🧹 Clean Old Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fix_json.py
        run: python fix_json.py

      - name: Commit changes
        run: |
          git config user.name "prathambhandary"
          git config user.email "pratham@firewave.in"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Deleting old JEE & KCET JUT Answer Key"
            git push origin main
          fi

  prepare:
    name: ⚙️ Prepare Refresh
    needs: cleanup
    runs-on: ubuntu-latest

    steps:
      - name: Initialize
        run: |
          echo "Preparing JEE refresh..."
          echo "Preparing KCET refresh..."

  jee:
    name: 🟦 Refresh JEE
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Refresh JEE
        run: |
          echo "Starting JEE refresh..."
          echo "Downloading questions..."
          echo "Processing answers..."
          echo "Processing solutions..."

  kcet:
    name: 🟩 Refresh KCET
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Refresh KCET
        run: |
          echo "Starting KCET refresh..."
          echo "Downloading questions..."
          echo "Processing answers..."
          echo "Processing solutions..."

  finalize:
    name: 🚀 Finalize
    needs: [jee, kcet]
    runs-on: ubuntu-latest

    steps:
      - name: Complete
        run: echo "JEE & KCET refresh completed successfully."