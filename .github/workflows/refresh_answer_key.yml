name: Refresh Answer Key and Solution from Jnanasudha.com (JEE & KCET)

on:
  push:
    paths:
      - "fix_json.py"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Delete Old Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fix_json.py
        run: python fix_json.py

      - name: Commit changes
        run: |
          git config user.name "prathambhandary"
          git config user.email "prathamb1501@gmail.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Deleting old JEE & KCET JUT Answer Key"
            git push origin main
          fi

  prepare:
    name: Prepare Refresh
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          echo "Preparing JEE refresh..."
          echo "Preparing KCET refresh..."

  trigger:
    name: Trigger Scraper
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JEE & KCET Scraper
        env:
          GH_TOKEN: ${{ secrets.PUSHKITTY_TOKEN }}
        run: gh workflow run "Auto Scrape Questions from Jnanasudha.com (JEE & KCET)" --repo prathambhandary/JUT-ReAttempter --ref main

  verify:
    name: Verify Trigger
    needs: trigger
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        run: echo "Scraper workflow triggered successfully."

  finish:
    name: Refresh Started
    needs: [trigger, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Complete
        run: echo "JEE & KCET refresh pipeline started."