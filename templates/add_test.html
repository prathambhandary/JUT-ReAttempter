<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose your test — JUT ReAttempter</title>
<script>
  (function(){ var t = localStorage.getItem('jut-theme') || 'light'; document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="site-header">
  <a href="{{ url_for('index') }}" class="brand">
    <span class="brand-mark">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="JUT ReAttempter logo">
    </span>
    <span class="brand-name">JUT ReAttempter<span class="sub">JEE Main practice CBT</span></span>
  </a>
  <div class="header-actions">
    <button class="icon-btn theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="select-shell">
  <div class="select-card">
    <h1>Add JUT Tests</h1>
    <p class="helper">Open and login to Jnanasudha.com and open your result page. <br>Look for 5 digit number labelled as "<strong>Details of NEW JEE: 1XXXX</strong>"".</p>

    <div id="form-error" class="form-error"></div>

    <div class="two-col">
      <div class="form-row">
        <label for="candidate-name">Enter the 5 digit Test ID:</label>
        <input type="text" id="test_id" placeholder="1xxxx" maxlength="6" required>
      </div>

      <div class="form-row">
        <label for="candidate-name">Select Exam Type:</label>
        <select id="exam_type" required>
          <option value="">Select Exam Type</option>
          <option value="JUT">JUT</option>
          <option value="CT">CT</option>
        </select>
      </div>

      <div class="form-row">
        <label for="candidate-name">Enter Exam Number:</label>
        <input type="number" id="exam_number" placeholder="3 or 23 or 58" required>
      </div>
      </div>

      <br>
      <div class="form-row">
            <label>Select the order in which the questions appeared in the exam:</label>

            <div class="radio-group">
                <p><strong>Questions 1–25</strong></p>

                <label>
                    <input type="radio" name="first_subject" id="first_physics" value="Physics" required>
                    Physics
                </label>

                <label>
                    <input type="radio" name="first_subject" id="first_chemistry" value="Chemistry">
                    Chemistry
                </label>

                <label>
                    <input type="radio" name="first_subject" id="first_mathematics" value="Mathematics">
                    Mathematics
                </label>
            </div>

            <br>

            <div class="radio-group">
                <p><strong>Questions 26–50</strong></p>

                <label>
                    <input type="radio" name="second_subject" id="second_physics" value="Physics" required>
                    Physics
                </label>

                <label>
                    <input type="radio" name="second_subject" id="second_chemistry" value="Chemistry">
                    Chemistry
                </label>

                <label>
                    <input type="radio" name="second_subject" id="second_mathematics" value="Mathematics">
                    Mathematics
                </label>
            </div>

            <br>

            <div class="radio-group">
                <p><strong>Questions 51–75</strong></p>

                <label>
                    <input type="radio" name="third_subject" id="third_physics" value="Physics" required>
                    Physics
                </label>

                <label>
                    <input type="radio" name="third_subject" id="third_chemistry" value="Chemistry">
                    Chemistry
                </label>

                <label>
                    <input type="radio" name="third_subject" id="third_mathematics" value="Mathematics">
                    Mathematics
                </label>
            </div>
        </div>
    </div>



    <div class="select-submit">
      <a class="btn btn-ghost" href="{{ url_for('index') }}">Back</a>   
      <button class="btn btn-primary" id="start-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
        Generate &amp; start test
      </button>
    </div>
  </div>
</main>

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
