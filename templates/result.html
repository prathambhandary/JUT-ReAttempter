<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your scorecard — JUT ReAttempter</title>
<script>
  (function(){ var t = localStorage.getItem('jut-theme') || 'light'; document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/result.css') }}">
<script>
  window.MathJax = { mml: { skipTags: ["script","noscript","style","textarea"] }, chtml: { scale: 1 } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/mml-chtml.js" id="mathjax-script" defer></script>
</head>
<body>

<header class="site-header">
  <a href="{{ url_for('index') }}" class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.5 7.5L22 10.5l-5.5 4.8L18 22l-6-4-6 4 1.5-6.7L2 10.5l6.5-1z"/></svg>
    </span>
    <span class="brand-name">JUT ReAttempter<span class="sub">JEE Main practice CBT</span></span>
  </a>
  <div class="header-actions">
    <button class="icon-btn theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="result-shell" id="result-shell">
  <p style="text-align:center;color:var(--text-muted);padding:60px 0;">Loading your scorecard…</p>
</main>

<script>window.JUT_SESSION_ID = {{ session_id | tojson }};</script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/result.js') }}"></script>
</body>
</html>
